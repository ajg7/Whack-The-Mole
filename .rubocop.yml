plugins:
  - rubocop-minitest
AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
Style/Documentation:
  Enabled: false
Minitest/MultipleAssertions:
  Enabled: false
Layout/EndOfLine:
  EnforcedStyle: lf
Naming/MethodParameterName:
  AllowedNames: [id, x, y]
Metrics/ClassLength:
  Exclude: [lib/whack_the_mole/window.rb]
Metrics/AbcSize:
  Exclude: [lib/whack_the_mole/window.rb, "test/**/*"]
Metrics/MethodLength:
  Exclude: [lib/whack_the_mole/window.rb]
